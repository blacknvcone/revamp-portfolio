name: Build & Deploy CMS

on:
  push:
    tags:
      - 'cms-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cms-payload

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract git tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/cms/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rolling restart via webhook
        run: |
          TAG="${{ needs.build-and-push.outputs.image-tag }}"
          PAYLOAD=$(printf '{"ref":"%s","sha":"%s","tag":"%s","namespace":"cms-payload","deployment":"cms-payload","image":"%s/%s:%s"}' \
            "$GITHUB_REF" "$GITHUB_SHA" "$TAG" "${{ env.REGISTRY }}" "${{ env.IMAGE_NAME }}" "$TAG")
          SIG="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | awk '{print $2}')"
          curl -f -X POST https://deploy.danipras.dev/hooks/deploy \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD"
